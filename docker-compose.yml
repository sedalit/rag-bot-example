services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docsbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docsbot}
      POSTGRES_DB: ${POSTGRES_DB:-docsbot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docsbot} -d ${POSTGRES_DB:-docsbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
